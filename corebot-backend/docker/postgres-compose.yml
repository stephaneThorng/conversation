services:
  postgres:
    image: postgres:17-alpine
    container_name: corebot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: corebot
      POSTGRES_USER: corebot
      POSTGRES_PASSWORD: corebot
    ports:
      - "5432:5432"
    volumes:
      - corebot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corebot -d corebot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  corebot-postgres-data:
